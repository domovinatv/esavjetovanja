[project]
name = "esavjetovanja"
version = "0.1.0"
description = "Otvoreni alati za preuzimanje, katalog i analizu savjetovanja s portala e-Savjetovanja (esavjetovanja.gov.hr)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
    "beautifulsoup4>=4.12",
]

[project.scripts]
esavjetovanja = "esavjetovanja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
